<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小猫钓鱼</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pixel.css">
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud-top">
  <div class="hud-left">
    <div class="pill coins"><span class="ico">🪙</span><b id="coins">0</b></div>
    <div class="pill level" title="等级越高，鱼的售价越高（每级 +2%）">
      <span>Lv.<b id="lv">1</b></span>
      <div class="expbar"><div id="expfill"></div></div>
    </div>
  </div>
  <div class="hud-center pill" id="env">
    <span id="scene-name">宁静湖畔</span><span class="sep">·</span>
    <span id="day">第1天</span><span id="clock">06:00</span><span id="phase">🌅清晨</span><span class="sep">·</span>
    <span id="weather">☀️晴朗</span>
  </div>
  <div class="hud-right" id="buffs"></div>
</div>

<div id="catch-pop"></div>
<div id="toasts"></div>

<div id="hud-bottom">
  <div id="log" class="panel-glass">
    <div class="log-title">最近渔获</div>
    <ul id="log-list"><li class="muted">还没有钓到鱼～</li></ul>
  </div>

  <div id="center-ctl">
    <div id="status" class="panel-glass">准备抛竿…</div>
    <div class="ctl-row">
      <button id="main-btn" class="big-btn">抛竿</button>
      <label class="switch" title="开启后小猫会自动抛竿和收竿，离线也会继续钓鱼">
        <input type="checkbox" id="auto-toggle" checked><span class="slider"></span><span class="lbl">自动挂机</span>
      </label>
    </div>
    <div id="equip" class="panel-glass"></div>
  </div>
  <div id="adv-bar" class="panel-glass hidden"></div>

  <div id="nav">
    <button data-open="bag" data-gi="bag"><span></span>背包<i id="bag-count"></i></button>
    <button data-open="wh" data-gi="warehouse"><span></span>仓库<i id="wh-count"></i></button>
    <button data-open="shop" data-gi="shop"><span></span>商店</button>
    <button data-open="market" data-gi="market"><span></span>寄卖</button>
    <button data-open="kitchen" data-gi="kitchen"><span></span>厨房</button>
    <button data-open="dex" data-gi="dex"><span></span>图鉴<i id="dex-count"></i></button>
    <button data-open="adv" data-gi="adv"><span></span>冒险</button>
    <button data-open="artisan" data-gi="smith"><span></span>工匠</button>
    <button data-open="quest" data-gi="quest"><span></span>任务</button>
    <button data-open="map" data-gi="compass"><span></span>航海</button>
    <button data-open="settings" data-gi="cog"><span></span>设置</button>
  </div>
</div>

<div id="battle" class="hidden">
  <div class="b-screen">
    <canvas id="b-canvas"></canvas>
    <div class="b-box foe"><div class="bb-name"><span id="b-name"></span><span id="b-lv"></span></div><div class="bb-hp"><i>HP</i><div class="hpbar"><div id="b-fhp"></div></div></div><div class="bb-num" id="b-fhpt"></div><div class="b-status" id="b-status"></div></div>
    <div class="b-box hero"><div class="bb-name"><span>小橘</span><span id="b-hlv"></span></div><div class="bb-hp"><i>HP</i><div class="hpbar"><div id="b-hhp"></div></div></div><div class="bb-num" id="b-hpt"></div><div class="ap" id="b-ap"></div></div>
  </div>
  <div class="b-bottom">
    <div id="b-log"></div>
    <div id="b-menu" class="hidden"></div>
  </div>
  <div class="b-btns"><span id="b-speed"></span><span id="b-mode"></span><button data-flee>撤退</button></div>
</div>

<div id="event-card" class="hidden"></div>
<div id="goal" class="panel-glass"></div>
<div id="tip" class="hidden"></div>

<div id="story" class="hidden">
  <div class="story-box">
    <div id="story-face"></div>
    <div class="story-main">
      <div id="story-name"></div>
      <div id="story-text"></div>
      <div id="story-choices"></div>
    </div>
    <div id="story-more">▼</div>
  </div>
</div>

<div id="modal-bg" class="hidden">
  <div id="modal">
    <header>
      <h2 id="modal-title"></h2>
      <div id="modal-tabs"></div>
      <button id="modal-close" title="关闭 (Esc)">✕</button>
    </header>
    <div id="modal-body"></div>
    <footer id="modal-foot"></footer>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/game.js"></script>
<script src="js/data_adv.js"></script>
<script src="js/data_v4.js"></script>
<script src="js/sprites.js"></script>
<script src="js/adventure.js"></script>
<script src="js/market.js"></script>
<script src="js/cook.js"></script>
<script src="js/quests.js"></script>
<script src="js/events.js"></script>
<script src="js/render.js"></script>
<script src="js/render_adv.js"></script>
<script src="js/battle_fx.js"></script>
<script src="js/ui_icons.js"></script>
<script src="js/ui.js"></script>
<script src="js/ui_adv.js"></script>
<script src="js/ui_v4.js"></script>
<script src="js/cheat.js"></script>
<script src="js/main.js"></script>
</body>
</html>
